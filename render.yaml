services:
  - type: worker
    name: news-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python start_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: Gemini_API_KEY
        sync: false 