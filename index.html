<style>
  html, body {
    margin: 0;
    padding: 0;
    /* Allow the body to scroll naturally - most reliable for mobile */
    overflow-x: hidden;
    overflow-y: auto !important; 
    height: auto;
    min-height: 100%;
    background-color: #F8FAFC;
    color: #0F172A;
    -webkit-font-smoothing: antialiased;
  }

  #root {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* FORCED ULTRA-THICK SCROLLBAR FOR MOBILE & DESKTOP */
  /* This targets the whole page scrollbar */
  ::-webkit-scrollbar {
    width: 16px !important; /* Extremely thick for easy dragging/visibility */
    height: 16px !important;
    display: block !important;
  }
  
  ::-webkit-scrollbar-track {
    background: #F1F5F9 !important; /* Visible track */
    border-left: 1px solid #E2E8F0;
  }
  
  ::-webkit-scrollbar-thumb {
    background: #3B82F6 !important; /* Bright Blue Handle */
    border-radius: 8px;
    border: 3px solid #F1F5F9; /* Contrast border */
  }

  ::-webkit-scrollbar-thumb:active {
    background: #1D4ED8 !important; /* Darker when dragging */
  }

  /* Support for Firefox */
  * {
    scrollbar-width: auto;
    scrollbar-color: #3B82F6 #F1F5F9;
  }

  .no-scrollbar::-webkit-scrollbar {
    display: none;
  }
  
  .no-scrollbar {
    -ms-overflow-style: none;
    scrollbar-width: none;
  }

  * {
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
</style>

</head>
